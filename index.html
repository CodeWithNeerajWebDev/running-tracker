<!DOCTYPE html>
<html>
<head>
    <meta name="google-site-verification" content="7H9Tu_R5pOmCgyaXc2LtVp4YqzynkBsIeKurtu05g0w" />
        <title>BMI Calculator</title>
        <style>
            body {
    font-family: Arial,sans-serif;
    text-align: center;
    margin-top: 50px;
    background-color: #f2f2f2;
}
.calcutor {
    background-color: white;
    width: 350px;
    margin: auto;
    padding: 30;
    border: 1px solid #ccc;
    border-radius: 15px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}
.calculator h1 {
    margin-bottom: 20px;
}

.calculator input {
    padding: 10px;
    margin: 8px;
    border: 1px solid #ccc;
    border-radius: 5px;
}

.calculator button {
    padding: 12px;
    margin-top: 15px;
    background-color: #007bff;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
.creator {
    margin-top: 25px;
    font-size: 13px;
    color: #777;
}
}
    </style>
    </head>

    <body>
        <div class="calculator">
        <h1>BMI Calculator</h1>

        <p>Welcome to my BMI Calculator</p>
        <label>Weight (kg):</label>
        <input type="number" id="weight">

        <br><br>

        <label>Height (cm):</label>
        <input type="number" id="height">

        <br><br>

        <button
    onclick="calculateBMI()">Calculate BMI</button>
    <p id="result"></p>
    <p class="creator">created by Neeraj Singh Rawat</p>
    <script>
    function calculateBMI() {
    let weight = document.getElementById("weight").value;
    let height = document.getElementById("height").value;

    height = height / 100;

    let bmi = weight / (height * height);

    let result = document.getElementById("result");

    if (bmi < 18.5) {
        result.innerText = "Your BMI is: " + bmi.toFixed(2) +
            "\nCategory: Underweight";
    }
    else if (bmi < 25) {
        result.innerText = "Your BMI is: " + bmi.toFixed(2) +
            "\nCategory: Normal";
    }
    else if (bmi < 30) {
        result.innerText = "Your BMI is: " + bmi.toFixed(2) +
            "\nCategory: Overweight";
    }
    else {
        result.innerText = "Your BMI is: " + bmi.toFixed(2) +
            "\nCategory: High BMI — Please consider talking to a healthcare professional.";
    }
}
    </script>
    </div>
    </body>
</html>

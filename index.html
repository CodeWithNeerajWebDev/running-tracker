<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Running Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🏃 Running Tracker</h1>

        <div class="stats">

            <div class="box">
                <h3>Distance</h3>
                <p id="distance">0.00 km</p>
            </div>

            <div class="box">
                <h3>Time</h3>
                <p id="time">00:00:00</p>
            </div>

            <div class="box">
                <h3>Speed</h3>
                <p id="speed">0.00 km/h</p>
            </div>

            <div class="box">
                <h3>Pace</h3>
                <p id="pace">0:00 min/km</p>
            </div>

        </div>

        <div class="buttons">
            <button id="startBtn">START</button>
            <button id="pauseBtn">PAUSE</button>
            <button id="stopBtn">STOP</button>
        </div>

        <p id="status">Press START to begin</p>

    </div>
    <footer>
        Created by Neeraj Singh Rawat 
    </footer>

    <script src="script.js"></script>

</body>
</html>
